name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build plugin + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          MANIFEST="$(node -p "JSON.parse(require('fs').readFileSync('placard.module.json','utf8')).version")"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag v$TAG must match package.json ($PKG) and placard.module.json ($MANIFEST)"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - run: pnpm typecheck
      - run: pnpm build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/places.pick-${{ steps.ver.outputs.version }}.placard-module
            dist/places.pick-${{ steps.ver.outputs.version }}.zip
